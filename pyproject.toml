[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-intake"
version = "0.1.0"
description = "Turn an Apple Notes folder into routed, dated records in a Markdown vault, using Claude to read photographed mail."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["apple-notes-parser>=0.2.0", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chief-intake = "chief_intake.cli:main"

[tool.setuptools]
packages = ["chief_intake"]

[tool.setuptools.package-data]
chief_intake = ["prompt.md", "schema.json", "launcher.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude CLI (set CHIEF_INTAKE_LIVE=1)"]
